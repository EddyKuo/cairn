# ============================================================
# C2 / 工具傳輸（part2 §2.5「C2 / 橫向移動」）
#   R-T1071-001  M0 首批 · dryrun    紅隊矩陣 #12（不列入通過計數：首發 dryrun 不產生告警）
#   R-T1105-001  M0 首批 · enabled   紅隊矩陣 #11 T1105 #7/#9/#10
# ============================================================
id: R-T1071-001
title: 非瀏覽器程序反覆查詢高風險 TLD（疑似 C2 beacon）
description: >
  非瀏覽器程序在 5 分鐘內對高風險頂級網域發出 5 次以上 DNS 查詢（Sysmon EID 22）。
  M0 以查詢頻率近似 beacon 週期性；自動更新程式為主要誤報來源，首發 dryrun。
severity: medium
attack: [T1071.001, T1571]
status: dryrun
score: 50
decay: 900s
deterministic: false
requires_events: [3, 22]

event: DNS_QUERY
threshold:
  count: 5
  within: 300s
where:
  - field: query_name
    op: ends_with_any
    value: ['.top', '.xyz', '.tk', '.ml', '.ga', '.cf', '.gq', '.pw', '.su', '.click', '.work', '.rest',
            '.zip', '.mov', '.cyou', '.icu', '.monster', '.buzz']
  - field: image
    op: not_ends_with_any
    value: ['\chrome.exe', '\msedge.exe', '\firefox.exe', '\brave.exe', '\opera.exe', '\iexplore.exe',
            '\msedgewebview2.exe', '\svchost.exe']
within: 300s

response:
  on_score_ge: 80
  actions: [alert]
  require_confirmation: true
---
id: R-T1105-001
title: 腳本直譯器或 LOLBin 下載可執行檔並落地
description: >
  certutil -urlcache、bitsadmin /transfer、PowerShell DownloadFile / Invoke-WebRequest -OutFile /
  Start-BitsTransfer 等下載行為。同一程序樹隨後落地可執行檔（+10）、
  並執行使用者可寫目錄下的程式（+15）時升分至 90。
severity: high
attack: [T1105]
status: enabled
score: 65
decay: 600s
deterministic: false
requires_events: [1, 3, 11, 22]

event: PROCESS_CREATE
within: 300s
where:
  - any_of:
      - all_of:
          - field: image
            op: ends_with
            value: '\certutil.exe'
          - field: command_line
            op: contains_any
            value: ['urlcache', '-verifyctl', '/verifyctl']
      - all_of:
          - field: image
            op: ends_with
            value: '\bitsadmin.exe'
          - field: command_line
            op: contains_any
            value: ['/transfer', '/addfile', '/download']
      - all_of:
          - field: image
            op: ends_with_any
            value: ['\powershell.exe', '\pwsh.exe']
          - field: command_line
            op: contains_any
            value: ['downloadfile', 'start-bitstransfer', 'invoke-webrequest', 'iwr ', '-outfile', 'wget ',
                    'curl ', 'net.webclient']

boosters:
  - id: executable_dropped
    event: FILE_CREATE
    score: 10
    where:
      - field: target_filename
        op: ends_with_any
        value: ['.exe', '.dll', '.scr', '.ps1', '.bat', '.cmd', '.vbs', '.hta', '.js', '.msi']
  - id: dropped_payload_executed
    event: PROCESS_CREATE
    score: 15
    where:
      # Sysmon EID 1 不含簽章資訊，故只以「位於使用者可寫目錄」判定；誤報由 within 視窗與「需先有下載命中」約束
      - field: image_in_user_writable_dir
        op: equals
        value: true
      - field: image
        op: not_ends_with_any
        value: ['\onedrive.exe', '\teams.exe', '\code.exe', '\update.exe']

response:
  on_score_ge: 80
  actions: [suspend_process, alert]
  require_confirmation: false
