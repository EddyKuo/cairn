# ============================================================
# 憑證竊取（part2 §2.5「憑證竊取」）
#   R-T1003-001  M0 首批 · enabled   紅隊矩陣 #9 T1003.001（必過）
#   R-T1003-002  延伸矩陣 · dryrun   T1003.001 #2 comsvcs MiniDump
#   R-T1003-003  延伸矩陣 · dryrun   T1003.002 #1 reg save hive
# ============================================================
id: R-T1003-001
title: 非白名單程序以高權限 handle 開啟 lsass.exe
description: >
  以含 PROCESS_VM_READ（0x0010）的存取遮罩開啟 lsass.exe，是傾印憑證（Mimikatz、ProcDump、
  comsvcs MiniDump）的必要步驟（Sysmon EID 10）。已知的系統元件與防毒排除在外。
severity: critical
attack: [T1003.001]
status: enabled
score: 85
decay: 900s
deterministic: false
requires_events: [10]

event: PROCESS_ACCESS
where:
  - field: target_image
    op: ends_with
    value: '\lsass.exe'
  - field: granted_access
    op: has_any
    value: ['0x0010']
  - field: image
    op: not_ends_with_any
    value: ['\msmpeng.exe', '\mssense.exe', '\csrss.exe', '\wininit.exe', '\services.exe', '\svchost.exe',
            '\lsm.exe', '\wmiprvse.exe', '\taskmgr.exe', '\mrt.exe', '\vmtoolsd.exe', '\cairnagent.exe',
            '\sysmon64.exe', '\sysmon.exe', '\searchprotocolhost.exe', '\mpcmdrun.exe']

response:
  on_score_ge: 80
  actions: [suspend_process, alert]
  require_confirmation: false
---
id: R-T1003-002
title: 以 comsvcs.dll MiniDump 傾印 lsass 記憶體
description: >
  rundll32.exe comsvcs.dll, MiniDump <lsass PID> <檔案> full —— 不需攜帶任何工具的 LOLBin 憑證傾印。
severity: critical
attack: [T1003.001]
status: dryrun
score: 90
decay: 900s
deterministic: false
requires_events: [1]

event: PROCESS_CREATE
where:
  - field: image
    op: ends_with
    value: '\rundll32.exe'
  - field: command_line
    op: contains
    value: 'comsvcs'
  - field: command_line
    op: contains_any
    value: ['minidump', '#24']

response:
  on_score_ge: 95
  actions: [terminate_process_tree, alert]
  require_confirmation: false
---
id: R-T1003-003
title: 匯出 SAM / SECURITY / SYSTEM 登錄 hive
description: >
  reg.exe save HKLM\SAM 等指令可離線取得本機帳號雜湊。
severity: high
attack: [T1003.002]
status: dryrun
score: 75
decay: 900s
deterministic: false
requires_events: [1]

event: PROCESS_CREATE
where:
  - field: image
    op: ends_with
    value: '\reg.exe'
  - field: command_line
    op: contains_any
    value: [' save ', ' export ']
  - field: command_line
    op: contains_any
    value: ['hklm\sam', 'hklm\security', 'hklm\system', 'hkey_local_machine\sam',
            'hkey_local_machine\security', 'hkey_local_machine\system']

response:
  on_score_ge: 80
  actions: [suspend_process, alert]
  require_confirmation: false
